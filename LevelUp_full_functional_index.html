<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LevelUp — B&A Co.</title>
<style>
:root{--bg:#050914;--panel:#0b1222;--panel2:#101a2e;--line:#1b2b49;--text:#eef5ff;--muted:#8fa3c2;--blue:#36a3ff;--cyan:#55e7ff;--green:#57e39b;--red:#ff667f;--gold:#ffd76a;--shadow:0 18px 50px #0008}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -10%,#123a70 0,#081326 32%,var(--bg) 70%);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.app{min-height:100vh}.top{height:68px;position:fixed;inset:0 0 auto 0;z-index:10;background:#050914e8;border-bottom:1px solid var(--line);backdrop-filter:blur(16px);display:flex;align-items:center;gap:16px;padding:0 20px}.brand{font-weight:900;font-size:22px;letter-spacing:-.5px}.brand i{color:var(--cyan);font-style:normal}.hamb{display:none;background:none;color:white;font-size:24px}.shell{display:flex;padding-top:68px}.side{width:240px;position:fixed;top:68px;bottom:0;padding:18px 12px;background:#071020;border-right:1px solid var(--line);overflow:auto}.navbtn{width:100%;padding:12px 14px;text-align:left;background:transparent;color:#a9bad4;border-radius:12px;margin:3px 0}.navbtn:hover,.navbtn.active{background:#10213a;color:white}.navbtn span{margin-right:9px}.main{margin-left:240px;width:calc(100% - 240px);padding:28px;max-width:1500px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:20px}.hero h1{font-size:32px;margin:0 0 5px}.muted{color:var(--muted)}.clock{color:var(--cyan);font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.grid2{display:grid;grid-template-columns:2fr 1fr;gap:15px}.card{background:linear-gradient(145deg,#0d172a,#091120);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:15px}.stat{font-size:27px;font-weight:900;margin-top:5px}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}.bar{height:9px;background:#17243a;border-radius:20px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:inherit}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.btn{background:linear-gradient(135deg,#178cf2,#42d8ff);color:#03101e;font-weight:800;padding:10px 15px;border-radius:11px}.btn.alt{background:#15253e;color:#dceaff;border:1px solid #27405f}.btn.danger{background:#3a1721;color:#ff9caf;border:1px solid #6e2638}.btn.gold{background:linear-gradient(135deg,#d9a72e,#ffe68c)}input,select,textarea{width:100%;background:#071020;border:1px solid #233a5e;color:white;border-radius:10px;padding:11px;outline:none}textarea{min-height:100px;resize:vertical}.field{margin:10px 0}.task{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#091427}.check{width:20px;height:20px;accent-color:var(--cyan)}.pill{display:inline-block;border:1px solid #284567;border-radius:999px;padding:5px 9px;color:#9fdfff;background:#0b1d32;font-size:12px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.chat{height:440px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:5px}.msg{max-width:78%;padding:11px 13px;border-radius:14px;margin:8px 0;white-space:pre-wrap}.msg.ai{background:#12213a;border:1px solid #233b5e}.msg.me{margin-left:auto;background:#167fd8}.chatbar{display:flex;gap:8px}.chatbar input{flex:1}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(460px,100%);background:#0b1425;border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:var(--shadow)}.logoBig{font-size:35px;font-weight:950;margin-bottom:4px}.notice{padding:11px;border-radius:10px;background:#0d2137;border:1px solid #214665;color:#bde9ff;margin:10px 0}.toast{position:fixed;right:20px;bottom:20px;z-index:50;background:#11223a;border:1px solid #2d5278;padding:13px 16px;border-radius:12px;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:40;padding:20px}.modalbox{width:min(600px,100%);max-height:90vh;overflow:auto;background:#0b1425;border:1px solid #29466c;border-radius:20px;padding:20px}.feature{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.feature div{background:#0a1729;border:1px solid var(--line);padding:14px;border-radius:14px}.small{font-size:13px}.adminOnly{border-color:#673344}.pro{border-color:#806522;background:linear-gradient(145deg,#19170c,#0d1726)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.side{transform:translateX(-100%);transition:.2s;z-index:20}.side.open{transform:none}.main{margin-left:0;width:100%;padding:18px}.hamb{display:block}.hero{align-items:flex-start}.feature{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}.hero h1{font-size:26px}.top{padding:0 12px}.main{padding:14px}.feature{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div><div id="toast" class="toast hidden"></div>
<script>
const KEY="levelup_full_v1";
const defaults={users:[],current:null,plans:[],tasks:{},xp:0,streak:0,doneDays:[],messages:[],notifications:[],reports:[],banned:[],settings:{}};let db=load();
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch(e){return {...defaults}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(s){let t=document.querySelector("#toast");t.textContent=s;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),2400)}
function user(){return db.users.find(x=>x.id===db.current)}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random()}
function today(){return new Date().toISOString().slice(0,10)}
function aiLocal(q){q=q.trim();let l=q.toLowerCase();if(!q)return"Tell me what you want help with.";if(l.includes("hello")||l.includes("hi "))return"Hey! I'm LevelUp AI. Tell me what you're working on and I'll help you step by step.";if(l.includes("sleep"))return"A solid starting point is a consistent sleep/wake schedule, a relaxing wind-down, and limiting stimulating screens right before bed. If sleep problems persist, talk with a parent/guardian or health professional.";if(l.includes("study")||l.includes("school"))return"Let's break it into a small plan: 1) choose one topic, 2) study for 25 minutes, 3) take a short break, 4) test yourself without notes, 5) review what you missed.";if(l.includes("skin")||l.includes("groom"))return"Keep it simple: gentle cleansing, moisturiser if needed, and sunscreen when outdoors. Follow product directions and patch-test new products. Avoid harsh or risky methods.";if(l.includes("plan"))return"I can turn a goal into daily steps. Start with one measurable goal, three small actions, and a weekly review.";return"I can help you think through that. For a more advanced answer, LevelUp's production AI connection would need a secure server-side AI provider. In this offline build, I can still help with planning, learning, habits, and general guidance."}
function auth(){root.innerHTML=`<main class="auth"><section class="authbox"><div class="logoBig">Level<span style="color:var(--cyan)">Up</span></div><p class="muted">B&A Co. • Build better habits, skills and momentum.</p><div class="tabs"><button class="btn" onclick="showAuth('login')">Log in</button><button class="btn alt" onclick="showAuth('signup')">Create account</button></div><div id="authform"></div><div class="notice small">This standalone build stores account data only in this browser. Real multi-device accounts require a secure backend.</div></section></main>`;showAuth("login")}
function showAuth(mode){document.querySelector("#authform").innerHTML=mode==="login"?`<h2>Welcome back</h2><div class="field"><input id="email" type="email" placeholder="Email"></div><div class="field"><input id="pass" type="password" placeholder="Password"></div><button class="btn" onclick="login()">Log in</button><p class="small muted">Demo admin: admin@levelup.local / admin123</p>`:`<h2>Create your LevelUp account</h2><div class="field"><input id="name" placeholder="Your name"></div><div class="field"><input id="email" type="email" placeholder="Email"></div><div class="field"><input id="pass" type="password" placeholder="Password"></div><button class="btn" onclick="signup()">Create account</button>`}
function signup(){let n=document.querySelector("#name").value.trim(),e=document.querySelector("#email").value.trim().toLowerCase(),p=document.querySelector("#pass").value;if(!n||!e||p.length<6)return toast("Enter your name, email and a 6+ character password.");if(db.users.some(x=>x.email===e))return toast("An account with that email already exists.");let u={id:uid(),name:n,email:e,password:p,role:"user",pro:false,created:new Date().toISOString()};db.users.push(u);db.current=u.id;save();render();toast("Account created")}
function login(){let e=document.querySelector("#email").value.trim().toLowerCase(),p=document.querySelector("#pass").value,u=db.users.find(x=>x.email===e&&x.password===p);if(!u)return toast("Incorrect email or password.");if(db.banned.includes(u.id))return toast("This account is suspended.");db.current=u.id;save();render()}
function seedAdmin(){if(!db.users.some(x=>x.email==="admin@levelup.local")){db.users.push({id:"admin",name:"LevelUp Admin",email:"admin@levelup.local",password:"admin123",role:"admin",pro:true,created:new Date().toISOString()});save()}}
function render(){if(!db.current||!user()){seedAdmin();auth();return}shell("dashboard")}
function shell(view){let u=user();root.innerHTML=`<div class="app"><header class="top"><button class="hamb" onclick="document.querySelector('.side').classList.toggle('open')">☰</button><div class="brand">Level<span>Up</span></div><div class="muted" style="flex:1">B&A Co.</div><span class="clock" id="clock"></span><button class="btn alt" onclick="logout()">Log out</button></header><aside class="side">${nav("dashboard","🏠","Dashboard")}${nav("plan","🗓️","My Plan")}${nav("progress","📈","Progress")}${nav("academy","📚","Academy")}${nav("ai","🤖","AI Coach")}${nav("checkin","📷","Check-in")}${nav("profile","👤","Profile")}${nav("pro","💎","LevelUp Pro")}${u.role==="admin"?nav("admin","🛡️","Admin Center"):''}</aside><main class="main" id="main"></main></div>`;page(view);clock();setInterval(clock,1000)}
function nav(v,i,t){return `<button class="navbtn ${location.hash==="#"+v?'active':''}" onclick="location.hash='${v}';shell('${v}')"><span>${i}</span>${t}</button>`}
function clock(){let x=document.querySelector("#clock");if(x)x.textContent=new Date().toLocaleString([], {weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}
function page(v){let u=user(),m=document.querySelector("#main");if(!m)return;location.hash=v;({dashboard,plan,progress,academy,ai,checkin,profile,pro,admin}[v]||dashboard)(m,u)}
function dashboard(m,u){let tasks=["Drink water","Morning hygiene","Move for 20+ minutes","Mindful break","Learn something new","Wind-down"];let d=db.tasks[today()]||{};let count=tasks.filter(x=>d[x]).length;let xp=db.xp||0;m.innerHTML=`<div class="hero"><div><div class="pill">LEVELUP • ${u.pro?"PRO":"FREE"}</div><h1>Hey, ${esc(u.name)} 👋</h1><p class="muted">Your dashboard for ${new Date().toLocaleDateString()}.</p></div><div><div class="label">Current time</div><div class="clock">${new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}</div></div></div><div class="grid"><div class="card"><div class="label">XP</div><div class="stat">${xp}</div><div class="bar"><i style="width:${Math.min(100,xp%100)}%"></i></div></div><div class="card"><div class="label">Today's progress</div><div class="stat">${count}/${tasks.length}</div></div><div class="card"><div class="label">Streak</div><div class="stat">🔥 ${db.streak||0}</div></div><div class="card"><div class="label">Plan items</div><div class="stat">${db.plans.length}</div></div></div><div class="grid2"><section class="card"><div class="row"><h2>Today's checklist</h2><button class="btn alt" onclick="page('plan')">Manage</button></div>${tasks.map((x,i)=>`<label class="task"><input class="check" type="checkbox" ${d[x]?"checked":""} onchange="toggleTask(${i})"><span>${x}</span><span class="pill">+${i===2?25:15} XP</span></label>`).join("")}</section><section class="card"><h2>Quick actions</h2><button class="btn" style="width:100%;margin:5px 0" onclick="page('ai')">Ask AI Coach</button><button class="btn alt" style="width:100%;margin:5px 0" onclick="page('academy')">Open Academy</button><button class="btn alt" style="width:100%;margin:5px 0" onclick="page('progress')">View progress</button>${!u.pro?`<button class="btn gold" style="width:100%;margin:5px 0" onclick="page('pro')">Explore Pro</button>`:""}</section></div>`}
function toggleTask(i){let names=["Drink water","Morning hygiene","Move for 20+ minutes","Mindful break","Learn something new","Wind-down"],d=db.tasks[today()]||{};d[names[i]]=!d[names[i]];db.tasks[today()]=d;if(d[names[i]])db.xp=(db.xp||0)+([15,15,25,15,15,15][i]);save();page("dashboard")}
function plan(m,u){m.innerHTML=`<div class="hero"><div><h1>My Plan</h1><p class="muted">Build a practical routine around your goals.</p></div></div><section class="card"><h2>Create a plan item</h2><div class="grid"><input id="ptitle" placeholder="Goal or activity"><select id="ptype"><option>Health & habits</option><option>Study</option><option>Skills</option><option>Confidence</option><option>Personal project</option></select><select id="pfreq"><option>Daily</option><option>3× weekly</option><option>Weekly</option></select><button class="btn" onclick="addPlan()">Add item</button></div></section><section class="card"><h2>Your plan</h2>${db.plans.length?db.plans.map((p,i)=>`<div class="task"><div style="flex:1"><b>${esc(p.title)}</b><div class="muted small">${p.type} • ${p.freq}</div></div><button class="btn danger" onclick="delPlan(${i})">Delete</button></div>`).join(""):`<p class="muted">No plan items yet.</p>`}</section>`}
function addPlan(){let t=document.querySelector("#ptitle").value.trim();if(!t)return toast("Enter a goal.");db.plans.push({title:t,type:document.querySelector("#ptype").value,freq:document.querySelector("#pfreq").value});save();toast("Plan item added");page("plan")}
function delPlan(i){db.plans.splice(i,1);save();page("plan")}
function progress(m,u){let xp=db.xp||0,level=Math.floor(xp/100)+1; m.innerHTML=`<div class="hero"><div><h1>Progress</h1><p class="muted">See your momentum over time.</p></div></div><div class="grid"><div class="card"><div class="label">Level</div><div class="stat">${level}</div></div><div class="card"><div class="label">Total XP</div><div class="stat">${xp}</div></div><div class="card"><div class="label">Streak</div><div class="stat">🔥 ${db.streak||0}</div></div><div class="card"><div class="label">Achievements</div><div class="stat">${Math.floor(xp/100)}</div></div></div><section class="card"><h2>Level ${level} progress</h2><div class="bar"><i style="width:${xp%100}%"></i></div><p class="muted small">${100-(xp%100)} XP until the next level.</p></section><section class="card"><h2>Focus areas</h2><div class="feature"><div>🌙 <b>Recovery</b><p class="small muted">Build consistent sleep and wind-down habits.</p></div><div>📖 <b>Learning</b><p class="small muted">Study, practise and review what you learn.</p></div><div>🧭 <b>Consistency</b><p class="small muted">Small repeatable actions beat extreme routines.</p></div></div></section>`}
function academy(m,u){let lessons=[["Skin basics","Simple, gentle routines and product safety."],["Sleep & recovery","Build a consistent wind-down routine."],["Confidence","Practise communication and self-respect."],["Study systems","Active recall, spaced review and focused sessions."],["Goal setting","Turn vague goals into measurable actions."]];m.innerHTML=`<div class="hero"><div><h1>Academy</h1><p class="muted">Short lessons designed for practical progress.</p></div></div><div class="feature">${lessons.map((x,i)=>`<div><span class="pill">LESSON ${i+1}</span><h3>${x[0]}</h3><p class="muted">${x[1]}</p><button class="btn" onclick="lesson('${esc(x[0])}')">Open lesson</button></div>`).join("")}</div><section class="card" style="margin-top:15px"><h2>Mini assessment</h2><p>What's a safer approach when trying a new skincare product?</p><button class="btn alt" onclick="exam(false)">Use it heavily immediately</button> <button class="btn" onclick="exam(true)">Follow directions and patch-test when appropriate</button></section>`}
function lesson(t){alert(t+"\\n\\nLevelUp lesson: start small, follow reliable guidance, and build consistency. Use the plan system to turn this into a daily action.");}
function exam(ok){toast(ok?"Correct — +25 XP":"Not quite — choose the safer, gradual approach.");if(ok){db.xp=(db.xp||0)+25;save()}}
function ai(m,u){m.innerHTML=`<div class="hero"><div><h1>AI Coach</h1><p class="muted">Ask questions, brainstorm, learn, plan or get help.</p></div><span class="pill">${u.pro?"PRO AI":"FREE AI"}</span></div><section class="card chat"><div id="messages" class="messages"></div><div class="chatbar"><input id="aiinput" placeholder="Message LevelUp AI..." onkeydown="if(event.key==='Enter')sendAI()"><button class="btn" onclick="sendAI()">Send</button></div></section><div class="notice small">This single-file version includes an offline conversational fallback. A genuinely unrestricted ChatGPT-like model requires a secure server-side AI connection and API key.</div>`;drawMsgs()}
function drawMsgs(){let x=document.querySelector("#messages");if(!x)return;let msgs=db.messages.slice(-40);if(!msgs.length)msgs=[{r:"ai",t:"Hey! I'm your LevelUp AI Coach. What are you working on today?"}];x.innerHTML=msgs.map(a=>`<div class="msg ${a.r==="me"?"me":"ai"}">${esc(a.t)}</div>`).join("");x.scrollTop=x.scrollHeight}
function sendAI(){let i=document.querySelector("#aiinput"),q=i.value.trim();if(!q)return;db.messages.push({r:"me",t:q});db.messages.push({r:"ai",t:aiLocal(q)});save();i.value="";drawMsgs()}
function checkin(m,u){m.innerHTML=`<div class="hero"><div><h1>Check-in</h1><p class="muted">Optional personal reflection. No appearance scoring.</p></div></div><section class="card"><h2>How are you doing?</h2><div class="grid"><select id="mood"><option>Great</option><option>Good</option><option>Okay</option><option>Low energy</option></select><select id="energy"><option>High energy</option><option>Normal</option><option>Low energy</option></select><input id="note" placeholder="One thing you want to improve today"></div><button class="btn" onclick="saveCheckin()">Save check-in</button><hr style="border-color:var(--line);margin:20px 0"><h2>Optional photo</h2><p class="muted small">For privacy, this standalone build does not upload photos. A production photo feature would require explicit consent, secure processing and retention controls.</p><input type="file" accept="image/*" capture="user"></section>`}
function saveCheckin(){db.notifications.push({t:new Date().toISOString(),text:"Check-in saved"});save();toast("Check-in saved")}
function profile(m,u){m.innerHTML=`<div class="hero"><div><h1>Profile</h1><p class="muted">Manage your LevelUp account.</p></div></div><section class="card"><h2>Personal details</h2><div class="grid"><div><label class="label">Name</label><input id="pn" value="${esc(u.name)}"></div><div><label class="label">Email</label><input value="${esc(u.email)}" disabled></div></div><button class="btn" onclick="saveProfile()">Save changes</button></section><section class="card"><h2>Account</h2><p class="muted">Member since ${new Date(u.created).toLocaleDateString()}</p><span class="pill">${u.role.toUpperCase()}</span> <span class="pill">${u.pro?"PRO":"FREE"}</span></section>`}
function saveProfile(){let n=document.querySelector("#pn").value.trim();if(!n)return toast("Name can't be empty.");user().name=n;save();toast("Profile updated");page("profile")}
function pro(m,u){m.innerHTML=`<div class="hero"><div><h1>LevelUp Pro 💎</h1><p class="muted">Unlock much more of the platform.</p></div><span class="pill">$7.50 / month</span></div><section class="card pro"><h2>Pro includes</h2><div class="feature"><div>🤖 <b>Expanded AI</b><p class="small muted">Higher limits and advanced coaching once connected to the production AI service.</p></div><div>📊 <b>Advanced analytics</b><p class="small muted">Deeper progress views and historical insights.</p></div><div>🧩 <b>Advanced plans</b><p class="small muted">More planning tools and custom routines.</p></div><div>📚 <b>Pro Academy</b><p class="small muted">Additional lessons and learning tracks.</p></div><div>💾 <b>More storage</b><p class="small muted">Expanded saved plans and information.</p></div><div>⚡ <b>Priority features</b><p class="small muted">Access new Pro tools first.</p></div></div><button class="btn gold" style="margin-top:18px" onclick="activatePro()">Activate Pro (local account)</button><p class="small muted">Real $7.50 payments require a secure payment provider and backend; this button only changes the local account flag.</p></section>`}
function activatePro(){user().pro=true;save();toast("Pro enabled for this local account");page("pro")}
function admin(m,u){if(u.role!=="admin")return page("dashboard");m.innerHTML=`<div class="hero"><div><h1>Admin Control Center</h1><p class="muted">Moderation, platform information and operational controls.</p></div><span class="pill">ADMIN ONLY</span></div><div class="grid"><div class="card"><div class="label">Users</div><div class="stat">${db.users.length}</div></div><div class="card"><div class="label">Pro accounts</div><div class="stat">${db.users.filter(x=>x.pro).length}</div></div><div class="card"><div class="label">Reports</div><div class="stat">${db.reports.length}</div></div><div class="card"><div class="label">Suspended</div><div class="stat">${db.banned.length}</div></div></div><section class="card adminOnly"><div class="row"><h2>User management</h2><input id="usearch" style="max-width:260px" placeholder="Search name/email" oninput="drawUsers()"></div><div id="users"></div></section><section class="card adminOnly"><h2>Moderation & reports</h2>${db.reports.length?db.reports.map((r,i)=>`<div class="task"><div style="flex:1"><b>${esc(r.reason)}</b><div class="small muted">User: ${esc(r.email)} • ${new Date(r.at).toLocaleString()}</div></div><button class="btn alt" onclick="resolveReport(${i})">Resolve</button></div>`).join(""):`<p class="muted">No reports waiting.</p>`}</section><section class="card"><h2>Platform controls</h2><div class="grid"><button class="btn alt" onclick="exportData()">Export local data</button><button class="btn alt" onclick="clearDemoData()">Reset local data</button><button class="btn alt" onclick="toast('Audit logging is represented locally in this build.')">Audit logs</button><button class="btn alt" onclick="toast('Feature flags panel ready for backend connection.')">Feature flags</button></div></section>`;drawUsers()}
function drawUsers(){let x=document.querySelector("#users");if(!x)return;let q=(document.querySelector("#usearch")?.value||"").toLowerCase();let us=db.users.filter(a=>(a.name+a.email).toLowerCase().includes(q));x.innerHTML=`<table><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody>${us.map(a=>`<tr><td>${esc(a.name)}<br><span class="small muted">${esc(a.email)}</span></td><td>${a.role}</td><td>${db.banned.includes(a.id)?"Suspended":"Active"} ${a.pro?"• Pro":""}</td><td>${a.id==="admin"?"—":`<button class="btn ${db.banned.includes(a.id)?"alt":"danger"}" onclick="toggleBan('${a.id}')">${db.banned.includes(a.id)?"Restore":"Suspend"}</button> <button class="btn alt" onclick="reportUser('${a.id}')">Report</button>`}</td></tr>`).join("")}</tbody></table>`}
function toggleBan(id){db.banned.includes(id)?db.banned=db.banned.filter(x=>x!==id):db.banned.push(id);save();page("admin")}
function reportUser(id){let a=db.users.find(x=>x.id===id);db.reports.push({email:a.email,reason:"Admin-created review",at:new Date().toISOString()});save();toast("Report created");page("admin")}
function resolveReport(i){db.reports.splice(i,1);save();page("admin")}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="levelup-data.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function clearDemoData(){if(confirm("Reset all local LevelUp data?")){localStorage.removeItem(KEY);db=load();seedAdmin();db.current="admin";save();render()}}
function logout(){db.current=null;save();auth()}
seedAdmin();if(db.current)render();else auth();
</script>
</body></html>
